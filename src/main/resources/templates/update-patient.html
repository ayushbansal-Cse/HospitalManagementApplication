<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Patient | MediCare</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                    radial-gradient(
                            circle at top left,
                            #172554,
                            transparent 35%
                    ),
                    radial-gradient(
                            circle at bottom right,
                            #3b0764,
                            transparent 35%
                    ),
                    #050816;

            color: white;
        }

        .layout {

            display: flex;

            min-height: 100vh;
        }

        .sidebar {

            width: 250px;

            padding: 30px 20px;

            background: rgba(10,15,35,0.75);

            backdrop-filter: blur(20px);

            border-right:
                    1px solid
                    rgba(255,255,255,0.08);
        }

        .logo {

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 45px;
        }

        .logo span {

            color: #38bdf8;
        }

        .menu-title {

            font-size: 11px;

            color: #64748b;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            margin-bottom: 15px;
        }

        .nav-item {

            display: block;

            padding: 13px 15px;

            margin-bottom: 8px;

            border-radius: 12px;

            color: #94a3b8;

            text-decoration: none;
        }

        .nav-item:hover {

            background:
                    rgba(56,189,248,0.12);

            color: white;
        }

        .nav-item.active {

            background:
                    linear-gradient(
                            135deg,
                            rgba(14,165,233,0.25),
                            rgba(124,58,237,0.25)
                    );

            color: white;
        }

        .main {

            flex: 1;

            padding: 35px;
        }

        .page-title {

            margin-bottom: 30px;
        }

        .page-title h1 {

            font-size: 32px;

            margin-bottom: 8px;
        }

        .page-title p {

            color: #94a3b8;
        }

        .form-card {

            max-width: 700px;

            background:
                    rgba(15,23,42,0.65);

            border:
                    1px solid
                    rgba(255,255,255,0.08);

            backdrop-filter: blur(20px);

            border-radius: 20px;

            padding: 30px;
        }

        .form-group {

            margin-bottom: 22px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;

            font-size: 14px;
        }

        input {

            width: 100%;

            padding: 14px 16px;

            border-radius: 10px;

            border:
                    1px solid
                    rgba(255,255,255,0.1);

            background:
                    rgba(255,255,255,0.05);

            color: white;

            outline: none;
        }

        input:focus {

            border-color: #38bdf8;

            box-shadow:
                    0 0 0 3px
                    rgba(56,189,248,0.1);
        }

        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 30px;
        }

        .save-btn,
        .cancel-btn {

            padding: 13px 22px;

            border-radius: 10px;

            text-decoration: none;

            font-weight: bold;

            cursor: pointer;
        }

        .save-btn {

            border: none;

            color: white;

            background:
                    linear-gradient(
                            135deg,
                            #0ea5e9,
                            #7c3aed
                    );
        }

        .cancel-btn {

            color: #cbd5e1;

            background:
                    rgba(255,255,255,0.05);

            border:
                    1px solid
                    rgba(255,255,255,0.1);
        }

    </style>

</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            Medi<span>Care</span>
        </div>

        <div class="menu-title">
            Main Menu
        </div>

        <a href="/dashboard"
           class="nav-item">
            🏠 Dashboard
        </a>

        <a href="/doctors"
           class="nav-item">
            👨‍⚕️ Doctors
        </a>

        <a href="/patients"
           class="nav-item active">
            🧑‍🤝‍🧑 Patients
        </a>

        <a href="/appointments"
           class="nav-item">
            📅 Appointments
        </a>

    </aside>


    <main class="main">

        <div class="page-title">

            <h1>Update Patient</h1>

            <p>
                Update patient contact information
            </p>

        </div>


        <div class="form-card">

            <form action="/patients/update"
                  method="post">

                <input type="hidden"
                       name="id"
                       th:value="${patient.id}">


                <div class="form-group">

                    <label>Patient Name</label>

                    <input type="text"
                           th:value="${patient.name}"
                           disabled>

                </div>


                <div class="form-group">

                    <label>Age</label>

                    <input type="number"
                           th:value="${patient.age}"
                           disabled>

                </div>


                <div class="form-group">

                    <label>Gender</label>

                    <input type="text"
                           th:value="${patient.gender}"
                           disabled>

                </div>


                <div class="form-group">

                    <label>Phone</label>

                    <input type="text"
                           name="phone"
                           th:value="${patient.phone}"
                           required>

                </div>


                <div class="form-group">

                    <label>Address</label>

                    <input type="text"
                           name="address"
                           th:value="${patient.address}"
                           required>

                </div>


                <div class="buttons">

                    <a href="/patients"
                       class="cancel-btn">

                        Cancel

                    </a>

                    <button type="submit"
                            class="save-btn">

                        Update Patient

                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

</body>

</html>
