<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Appointment | MediCare</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background:
                    radial-gradient(circle at top left, #172554, transparent 35%),
                    radial-gradient(circle at bottom right, #3b0764, transparent 35%),
                    #050816;
            color: white;
            min-height: 100vh;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            width: 250px;
            background: rgba(10, 15, 35, 0.88);
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: 28px 18px;
            backdrop-filter: blur(20px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 45px;
            padding-left: 12px;
            color: #ffffff;
        }

        .logo span {
            color: #22d3ee;
            margin-right: 8px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-item {
            text-decoration: none;
            color: #9ca3af;
            padding: 14px 16px;
            border-radius: 12px;
            transition: 0.25s;
            font-size: 15px;
        }

        .nav-item:hover {
            background: rgba(34, 211, 238, 0.08);
            color: #ffffff;
        }

        .nav-item.active {
            background: linear-gradient(
                    135deg,
                    rgba(34, 211, 238, 0.18),
                    rgba(99, 102, 241, 0.18)
            );
            color: #ffffff;
            border: 1px solid rgba(34, 211, 238, 0.2);
        }

        /* ================= MAIN ================= */

        .main {
            flex: 1;
            padding: 35px 45px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .topbar h1 {
            font-size: 30px;
        }

        .topbar p {
            color: #9ca3af;
            margin-top: 7px;
        }

        .back-btn {
            text-decoration: none;
            color: #cbd5e1;
            padding: 11px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            transition: 0.25s;
        }

        .back-btn:hover {
            color: white;
            border-color: #22d3ee;
        }

        /* ================= FORM CARD ================= */

        .card {
            max-width: 850px;
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            padding: 35px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.35);
        }

        .card-title {
            font-size: 21px;
            margin-bottom: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            color: #cbd5e1;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 14px 15px;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(2, 6, 23, 0.7);
            color: white;
            outline: none;
            font-size: 14px;
            transition: 0.25s;
        }

        input:focus,
        select:focus {
            border-color: #22d3ee;
            box-shadow: 0 0 0 3px rgba(34,211,238,0.08);
        }

        select option {
            background: #0f172a;
            color: white;
        }

        /* ================= BUTTONS ================= */

        .actions {
            display: flex;
            gap: 14px;
            margin-top: 32px;
        }

        .btn {
            padding: 13px 22px;
            border-radius: 11px;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: 0.25s;
        }

        .cancel-btn {
            color: #cbd5e1;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .cancel-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .save-btn {
            color: white;
            background: linear-gradient(
                    135deg,
                    #06b6d4,
                    #6366f1
            );
            box-shadow: 0 10px 25px rgba(59,130,246,0.25);
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(59,130,246,0.35);
        }

        .error {
            margin-top: 20px;
            padding: 13px 15px;
            border-radius: 10px;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.25);
            color: #fca5a5;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {

            .sidebar {
                width: 190px;
            }

            .main {
                padding: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: span 1;
            }

        }

        @media (max-width: 600px) {

            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                padding: 18px;
            }

            .logo {
                margin-bottom: 20px;
            }

            .nav {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .main {
                padding: 20px;
            }

            .topbar {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }

            .card {
                padding: 22px;
            }
        }

    </style>

</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <span>✚</span>
            MediCare
        </div>

        <nav class="nav">

            <a href="/dashboard" class="nav-item">
                🏠 Dashboard
            </a>

            <a href="/doctors" class="nav-item">
                👨‍⚕️ Doctors
            </a>

            <a href="/patients" class="nav-item">
                🧑‍🤝‍🧑 Patients
            </a>

            <a href="/appointments" class="nav-item active">
                📅 Appointments
            </a>

        </nav>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main">

        <div class="topbar">

            <div>
                <h1>Book Appointment</h1>
                <p>Schedule a new patient appointment</p>
            </div>

            <a href="/appointments" class="back-btn">
                ← Back
            </a>

        </div>


        <div class="card">

            <div class="card-title">
                Appointment Details
            </div>


            <form action="/appointments/add" method="post">

                <div class="form-grid">


                    <!-- PATIENT -->

                    <div class="form-group">

                        <label for="patientId">
                            Select Patient
                        </label>

                        <select
                                id="patientId"
                                name="patientId"
                                required>

                            <option value="">
                                -- Select Patient --
                            </option>

                            <option
                                    th:each="patient : ${patients}"
                                    th:value="${patient.id}"
                                    th:text="${patient.name + ' (ID: ' + patient.id + ')'}">
                                Patient Name
                            </option>

                        </select>

                    </div>


                    <!-- DOCTOR -->

                    <div class="form-group">

                        <label for="doctorId">
                            Select Doctor
                        </label>

                        <select
                                id="doctorId"
                                name="doctorId"
                                required>

                            <option value="">
                                -- Select Doctor --
                            </option>

                            <option
                                    th:each="doctor : ${doctors}"
                                    th:value="${doctor.id}"
                                    th:text="${doctor.name + ' - ' + doctor.specialization}">
                                Doctor Name
                            </option>

                        </select>

                    </div>


                    <!-- DATE -->

                    <div class="form-group">

                        <label for="appointmentDate">
                            Appointment Date
                        </label>

                        <input
                                type="date"
                                id="appointmentDate"
                                name="appointmentDate"
                                required>

                    </div>


                    <!-- STATUS -->

                    <div class="form-group">

                        <label for="status">
                            Status
                        </label>

                        <select
                                id="status"
                                name="status"
                                required>

                            <option value="Booked">
                                Booked
                            </option>

                            <option value="Completed">
                                Completed
                            </option>

                            <option value="Cancelled">
                                Cancelled
                            </option>

                        </select>

                    </div>

                </div>


                <!-- ERROR -->

                <div
                        class="error"
                        th:if="${error}"
                        th:text="${error}">
                    Failed to book appointment
                </div>


                <!-- BUTTONS -->

                <div class="actions">

                    <a
                            href="/appointments"
                            class="btn cancel-btn">
                        Cancel
                    </a>

                    <button
                            type="submit"
                            class="btn save-btn">
                        📅 Book Appointment
                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

</body>

</html>
