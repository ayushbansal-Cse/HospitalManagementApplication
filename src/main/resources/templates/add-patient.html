<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Patient | MediCare</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                    radial-gradient(
                            circle at top left,
                            #172554,
                            transparent 35%
                    ),

                    radial-gradient(
                            circle at bottom right,
                            #3b0764,
                            transparent 35%
                    ),

                    #050816;

            color: white;
        }


        .layout {

            display: flex;

            min-height: 100vh;
        }


        /* ================= SIDEBAR ================= */

        .sidebar {

            width: 250px;

            padding: 30px 20px;

            background:
                    rgba(10,15,35,0.75);

            backdrop-filter: blur(20px);

            border-right:
                    1px solid
                    rgba(255,255,255,0.08);
        }


        .logo {

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 45px;
        }


        .logo span {

            color: #38bdf8;
        }


        .menu-title {

            font-size: 11px;

            color: #64748b;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            margin-bottom: 15px;
        }


        .nav-item {

            display: block;

            padding: 13px 15px;

            margin-bottom: 8px;

            border-radius: 12px;

            color: #94a3b8;

            text-decoration: none;

            transition: 0.3s;
        }


        .nav-item:hover {

            background:
                    rgba(56,189,248,0.12);

            color: white;
        }


        .nav-item.active {

            background:
                    linear-gradient(
                            135deg,
                            rgba(14,165,233,0.25),
                            rgba(124,58,237,0.25)
                    );

            color: white;

            border:
                    1px solid
                    rgba(56,189,248,0.2);
        }


        /* ================= MAIN ================= */

        .main {

            flex: 1;

            padding: 35px;

            display: flex;

            justify-content: center;
        }


        .form-wrapper {

            width: 100%;

            max-width: 850px;
        }


        .topbar {

            margin-bottom: 30px;
        }


        .topbar h1 {

            font-size: 32px;

            margin-bottom: 8px;
        }


        .topbar p {

            color: #94a3b8;
        }


        /* ================= FORM CARD ================= */

        .form-card {

            background:
                    rgba(15,23,42,0.65);

            border:
                    1px solid
                    rgba(255,255,255,0.08);

            backdrop-filter: blur(20px);

            border-radius: 22px;

            padding: 30px;
        }


        .form-card h2 {

            font-size: 20px;

            margin-bottom: 25px;
        }


        .form-grid {

            display: grid;

            grid-template-columns:
                    1fr 1fr;

            gap: 22px;
        }


        .form-group {

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .form-group.full {

            grid-column: 1 / -1;
        }


        label {

            font-size: 13px;

            color: #cbd5e1;
        }


        input,
        select {

            width: 100%;

            padding: 14px 15px;

            border-radius: 10px;

            border:
                    1px solid
                    rgba(255,255,255,0.1);

            outline: none;

            background:
                    rgba(255,255,255,0.05);

            color: white;

            font-size: 14px;
        }


        input:focus,
        select:focus {

            border-color:
                    rgba(56,189,248,0.6);

            box-shadow:
                    0 0 0 3px
                    rgba(56,189,248,0.08);
        }


        select option {

            background: #0f172a;

            color: white;
        }


        .error {

            margin-top: 15px;

            padding: 12px;

            border-radius: 10px;

            background:
                    rgba(239,68,68,0.1);

            border:
                    1px solid
                    rgba(239,68,68,0.3);

            color: #fca5a5;

            font-size: 14px;
        }


        .buttons {

            display: flex;

            justify-content: flex-end;

            gap: 12px;

            margin-top: 30px;
        }


        .btn {

            padding: 13px 22px;

            border-radius: 11px;

            font-size: 14px;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;

            border: none;
        }


        .cancel-btn {

            color: #cbd5e1;

            background:
                    rgba(255,255,255,0.06);

            border:
                    1px solid
                    rgba(255,255,255,0.08);
        }


        .save-btn {

            color: white;

            background:
                    linear-gradient(
                            135deg,
                            #0ea5e9,
                            #7c3aed
                    );

            box-shadow:
                    0 10px 30px
                    rgba(14,165,233,0.2);
        }


        .btn:hover {

            transform:
                    translateY(-2px);
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {

            .sidebar {

                width: 190px;
            }


            .main {

                padding: 25px;
            }


            .form-grid {

                grid-template-columns: 1fr;
            }


            .form-group.full {

                grid-column: auto;
            }
        }


        @media (max-width: 600px) {

            .sidebar {

                display: none;
            }


            .main {

                padding: 20px;
            }
        }

    </style>

</head>


<body>


<div class="layout">


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">


        <div class="logo">

            Medi<span>Care</span>

        </div>


        <div class="menu-title">

            Main Menu

        </div>


        <a href="/dashboard"
           class="nav-item">

            🏠 Dashboard

        </a>


        <a href="#"
           class="nav-item">

            👨‍⚕️ Doctors

        </a>


        <a href="/patients"
           class="nav-item active">

            🧑‍🤝‍🧑 Patients

        </a>


        <a href="#"
           class="nav-item">

            📅 Appointments

        </a>


    </aside>



    <!-- ================= MAIN ================= -->

    <main class="main">


        <div class="form-wrapper">


            <div class="topbar">

                <h1>
                    Add New Patient
                </h1>


                <p>
                    Enter patient information
                    to create a new record
                </p>

            </div>



            <div class="form-card">


                <h2>
                    Patient Information
                </h2>


                <!-- IMPORTANT: FORM ACTION -->

                <form action="/patients/add"
                      method="post">


                    <div class="form-grid">


                        <!-- NAME -->

                        <div class="form-group">

                            <label>
                                Full Name
                            </label>

                            <input
                                    type="text"
                                    name="name"
                                    placeholder="Enter patient name"
                                    required
                            >

                        </div>



                        <!-- AGE -->

                        <div class="form-group">

                            <label>
                                Age
                            </label>

                            <input
                                    type="number"
                                    name="age"
                                    placeholder="Enter age"
                                    min="1"
                                    max="120"
                                    required
                            >

                        </div>



                        <!-- GENDER -->

                        <div class="form-group">

                            <label>
                                Gender
                            </label>

                            <select name="gender"
                                    required>

                                <option value="">
                                    Select gender
                                </option>

                                <option value="Male">
                                    Male
                                </option>

                                <option value="Female">
                                    Female
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>



                        <!-- PHONE -->

                        <div class="form-group">

                            <label>
                                Phone Number
                            </label>

                            <input
                                    type="tel"
                                    name="phone"
                                    placeholder="Enter phone number"
                                    required
                            >

                        </div>



                        <!-- ADDRESS -->

                        <div class="form-group full">

                            <label>
                                Address
                            </label>

                            <input
                                    type="text"
                                    name="address"
                                    placeholder="Enter patient address"
                                    required
                            >

                        </div>


                    </div>



                    <!-- ERROR MESSAGE -->

                    <div class="error"
                         th:if="${error}"
                         th:text="${error}">
                    </div>



                    <!-- BUTTONS -->

                    <div class="buttons">


                        <a href="/patients"
                           class="btn cancel-btn">

                            Cancel

                        </a>


                        <button
                                type="submit"
                                class="btn save-btn">

                            Save Patient

                        </button>


                    </div>


                </form>


            </div>


        </div>


    </main>


</div>


</body>

</html>
