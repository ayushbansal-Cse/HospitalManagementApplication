<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Doctors | MediCare</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                    radial-gradient(
                            circle at top left,
                            #172554,
                            transparent 35%
                    ),

                    radial-gradient(
                            circle at bottom right,
                            #3b0764,
                            transparent 35%
                    ),

                    #050816;

            color: white;
        }

        .layout {

            display: flex;

            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {

            width: 250px;

            padding: 30px 20px;

            background:
                    rgba(10,15,35,0.75);

            backdrop-filter: blur(20px);

            border-right:
                    1px solid
                    rgba(255,255,255,0.08);
        }

        .logo {

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 45px;
        }

        .logo span {

            color: #38bdf8;
        }

        .menu-title {

            font-size: 11px;

            color: #64748b;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            margin-bottom: 15px;
        }

        /* ================= NAVIGATION ================= */

        .nav-item {

            display: block;

            padding: 13px 15px;

            margin-bottom: 8px;

            border-radius: 12px;

            color: #94a3b8;

            text-decoration: none;

            transition: 0.3s;
        }

        .nav-item:hover {

            background:
                    rgba(56,189,248,0.12);

            color: white;

            text-decoration: none;
        }

        .nav-item.active {

            background:
                    linear-gradient(
                            135deg,
                            rgba(14,165,233,0.25),
                            rgba(124,58,237,0.25)
                    );

            color: white;

            border:
                    1px solid
                    rgba(56,189,248,0.2);
        }

        /* ================= MAIN ================= */

        .main {

            flex: 1;

            padding: 35px;
        }

        .topbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;
        }

        .topbar h1 {

            font-size: 32px;

            margin-bottom: 8px;
        }

        .topbar p {

            color: #94a3b8;
        }

        /* ================= ADD BUTTON ================= */

        .add-btn {

            padding: 13px 20px;

            border-radius: 11px;

            text-decoration: none;

            color: white;

            font-size: 14px;

            font-weight: bold;

            background:
                    linear-gradient(
                            135deg,
                            #0ea5e9,
                            #7c3aed
                    );

            box-shadow:
                    0 10px 30px
                    rgba(14,165,233,0.2);

            transition: 0.3s;
        }

        .add-btn:hover {

            transform:
                    translateY(-2px);
        }

        /* ================= SEARCH ================= */

        .search-box {

            margin-bottom: 25px;
        }

        .search-box form {

            display: flex;

            gap: 10px;

            max-width: 600px;
        }

        .search-box input {

            flex: 1;

            padding: 14px 16px;

            border-radius: 11px;

            border:
                    1px solid
                    rgba(255,255,255,0.08);

            outline: none;

            background:
                    rgba(15,23,42,0.65);

            color: white;

            font-size: 14px;
        }

        .search-box input::placeholder {

            color: #64748b;
        }

        .search-box input:focus {

            border-color:
                    rgba(56,189,248,0.6);

            box-shadow:
                    0 0 0 3px
                    rgba(56,189,248,0.08);
        }

        .search-btn {

            padding: 0 20px;

            border: none;

            border-radius: 11px;

            cursor: pointer;

            color: white;

            font-weight: bold;

            background:
                    linear-gradient(
                            135deg,
                            #0ea5e9,
                            #7c3aed
                    );
        }

        .clear-btn {

            padding: 13px 18px;

            border-radius: 11px;

            text-decoration: none;

            color: #cbd5e1;

            border:
                    1px solid
                    rgba(255,255,255,0.08);

            background:
                    rgba(15,23,42,0.65);
        }

        /* ================= TABLE ================= */

        .table-card {

            background:
                    rgba(15,23,42,0.65);

            border:
                    1px solid
                    rgba(255,255,255,0.08);

            backdrop-filter: blur(20px);

            border-radius: 20px;

            overflow: hidden;
        }

        table {

            width: 100%;

            border-collapse: collapse;
        }

        thead {

            background:
                    rgba(255,255,255,0.04);
        }

        th {

            padding: 17px;

            text-align: left;

            font-size: 12px;

            color: #94a3b8;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }

        td {

            padding: 18px 17px;

            border-top:
                    1px solid
                    rgba(255,255,255,0.06);

            color: #e2e8f0;

            font-size: 14px;
        }

        tbody tr {

            transition: 0.2s;
        }

        tbody tr:hover {

            background:
                    rgba(255,255,255,0.03);
        }

        .doctor-name {

            font-weight: bold;

            color: white;
        }

        .specialization {

            color: #38bdf8;
        }

        /* ================= ACTION ================= */

        .actions {

            display: flex;

            gap: 8px;
        }

        .edit-btn {

            display: inline-block;

            padding: 8px 12px;

            border-radius: 8px;

            text-decoration: none;

            color: #38bdf8;

            background:
                    rgba(56,189,248,0.10);

            border:
                    1px solid
                    rgba(56,189,248,0.15);

            font-size: 12px;

            font-weight: bold;

            transition: 0.2s;
        }

        .edit-btn:hover {

            background:
                    rgba(56,189,248,0.20);
        }

        .delete-btn {

            display: inline-block;

            padding: 8px 12px;

            border-radius: 8px;

            text-decoration: none;

            color: #f87171;

            background:
                    rgba(248,113,113,0.10);

            border:
                    1px solid
                    rgba(248,113,113,0.15);

            font-size: 12px;

            font-weight: bold;

            transition: 0.2s;
        }

        .delete-btn:hover {

            background:
                    rgba(248,113,113,0.20);
        }

        /* ================= EMPTY ================= */

        .empty {

            text-align: center;

            padding: 50px;

            color: #64748b;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 1000px) {

            .sidebar {

                width: 210px;
            }

            .main {

                padding: 25px;
            }

            .table-card {

                overflow-x: auto;
            }

            table {

                min-width: 900px;
            }
        }

        @media (max-width: 600px) {

            .sidebar {

                display: none;
            }

            .main {

                padding: 20px;
            }

            .topbar {

                align-items: flex-start;

                gap: 15px;

                flex-direction: column;
            }

            .search-box form {

                flex-direction: column;
            }

            .search-btn {

                padding: 13px;
            }
        }

    </style>

</head>

<body>

<div class="layout">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">

            Medi<span>Care</span>

        </div>

        <div class="menu-title">

            Main Menu

        </div>

        <a href="/dashboard"
           class="nav-item">

            🏠 Dashboard

        </a>

        <a href="/doctors"
           class="nav-item active">

            👨‍⚕️ Doctors

        </a>

        <a href="/patients"
           class="nav-item">

            🧑‍🤝‍🧑 Patients

        </a>

        <a href="/appointments"
           class="nav-item">

            📅 Appointments

        </a>

        <!-- LOGOUT -->

        <a href="/logout"
           class="nav-item">

            🚪 Logout

        </a>

    </aside>

    <!-- ================= MAIN ================= -->

    <main class="main">

        <div class="topbar">

            <div>

                <h1>
                    Doctors
                </h1>

                <p>
                    Manage hospital doctors and specialists
                </p>

            </div>

            <a href="/doctors/add"
               class="add-btn">

                + Add Doctor

            </a>

        </div>

        <!-- ================= SEARCH ================= -->

        <div class="search-box">

            <form action="/doctors"
                  method="get">

                <input
                        type="text"
                        name="search"
                        th:value="${search}"
                        placeholder="Search doctors by name..."
                        autocomplete="off"
                >

                <button
                        type="submit"
                        class="search-btn">

                    Search

                </button>

                <a href="/doctors"
                   class="clear-btn">

                    Clear

                </a>

            </form>

        </div>

        <!-- ================= TABLE ================= -->

        <div class="table-card">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Doctor Name</th>

                    <th>Specialization</th>

                    <th>Experience</th>

                    <th>Phone</th>

                    <th>Action</th>

                </tr>

                </thead>

                <tbody>

                <!-- EMPTY -->

                <tr th:if="${doctors == null || #lists.isEmpty(doctors)}">

                    <td colspan="6"
                        class="empty">

                        No doctors found

                    </td>

                </tr>

                <!-- DOCTOR ROW -->

                <tr th:each="doctor : ${doctors}">

                    <td th:text="${doctor.id}">

                        1

                    </td>

                    <td class="doctor-name"
                        th:text="${doctor.name}">

                        Doctor Name

                    </td>

                    <td class="specialization"
                        th:text="${doctor.specialization}">

                        Cardiology

                    </td>

                    <td th:text="${doctor.experience}">

                        5 Years

                    </td>

                    <td th:text="${doctor.phone}">

                        9876543210

                    </td>

                    <!-- ACTION -->

                    <td>

                        <div class="actions">

                            <a
                                    th:href="@{/doctors/update(id=${doctor.id})}"
                                    class="edit-btn">

                                ✏️ Edit

                            </a>

                            <a
                                    th:href="@{/doctors/delete(id=${doctor.id})}"
                                    class="delete-btn"
                                    onclick="return confirm('Are you sure you want to delete this doctor?');">

                                🗑️ Delete

                            </a>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

</body>

</html>
