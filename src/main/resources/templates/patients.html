<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Patients | MediCare</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background:

                    radial-gradient(
                            circle at top left,
                            #172554,
                            transparent 35%
                    ),

                    radial-gradient(
                            circle at bottom right,
                            #3b0764,
                            transparent 35%
                    ),

                    #050816;

            color: #ffffff;
        }

        .layout {

            display: flex;

            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {

            width: 250px;

            padding: 30px 20px;

            background:
                    rgba(10, 15, 35, 0.75);

            backdrop-filter: blur(20px);

            border-right:
                    1px solid
                    rgba(255,255,255,0.08);
        }

        .logo {

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 45px;

            color: #ffffff;
        }

        .logo span {

            color: #38bdf8;
        }

        .menu-title {

            font-size: 11px;

            color: #64748b;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            margin-bottom: 15px;
        }

        /* ================= NAVIGATION ================= */

        .nav-item {

            display: block;

            padding: 13px 15px;

            margin-bottom: 8px;

            border-radius: 12px;

            color: #94a3b8;

            text-decoration: none;

            transition: 0.3s;
        }

        .nav-item:hover {

            background:
                    rgba(56,189,248,0.12);

            color: #ffffff;

            text-decoration: none;
        }

        .nav-item.active {

            background:
                    linear-gradient(
                            135deg,
                            rgba(14,165,233,0.25),
                            rgba(124,58,237,0.25)
                    );

            color: #ffffff;

            border:
                    1px solid
                    rgba(56,189,248,0.2);
        }

        /* ================= MAIN ================= */

        .main {

            flex: 1;

            padding: 35px;

            overflow-x: auto;
        }

        .topbar {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 35px;
        }

        .page-title h1 {

            font-size: 32px;

            margin-bottom: 7px;
        }

        .page-title p {

            color: #94a3b8;
        }

        /* ================= ADD BUTTON ================= */

        .add-btn {

            border: none;

            padding: 13px 22px;

            border-radius: 12px;

            background:
                    linear-gradient(
                            135deg,
                            #0ea5e9,
                            #7c3aed
                    );

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                    0 10px 30px
                    rgba(14,165,233,0.2);

            text-decoration: none;

            display: inline-block;

            transition: 0.3s;
        }

        .add-btn:hover {

            transform:
                    translateY(-2px);

            box-shadow:
                    0 15px 35px
                    rgba(14,165,233,0.3);
        }

        /* ================= SEARCH ================= */

        .search-box {

            background:
                    rgba(15,23,42,0.65);

            border:
                    1px solid
                    rgba(255,255,255,0.08);

            backdrop-filter: blur(20px);

            border-radius: 18px;

            padding: 20px;

            margin-bottom: 25px;
        }

        .search-box input {

            width: 100%;

            padding: 14px 18px;

            border-radius: 10px;

            border:
                    1px solid
                    rgba(255,255,255,0.1);

            outline: none;

            background:
                    rgba(255,255,255,0.05);

            color: white;

            font-size: 14px;
        }

        .search-box input::placeholder {

            color: #64748b;
        }

        /* ================= TABLE ================= */

        .table-card {

            background:
                    rgba(15,23,42,0.65);

            border:
                    1px solid
                    rgba(255,255,255,0.08);

            backdrop-filter: blur(20px);

            border-radius: 20px;

            padding: 25px;

            overflow-x: auto;
        }

        .table-header {

            display: flex;

            justify-content: space-between;

            margin-bottom: 20px;
        }

        .table-header h2 {

            font-size: 19px;
        }

        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 850px;
        }

        th {

            text-align: left;

            padding: 15px;

            color: #64748b;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;

            border-bottom:
                    1px solid
                    rgba(255,255,255,0.08);
        }

        td {

            padding: 17px 15px;

            color: #cbd5e1;

            border-bottom:
                    1px solid
                    rgba(255,255,255,0.05);

            font-size: 14px;
        }

        tr:hover td {

            background:
                    rgba(255,255,255,0.025);
        }

        .patient-name {

            color: white;

            font-weight: bold;
        }

        .patient-id {

            color: #38bdf8;

            font-weight: bold;
        }

        /* ================= EDIT BUTTON ================= */

        .edit-btn {

            display: inline-block;

            padding: 8px 14px;

            border-radius: 8px;

            background:
                    rgba(56,189,248,0.12);

            border:
                    1px solid
                    rgba(56,189,248,0.25);

            color: #38bdf8;

            text-decoration: none;

            font-size: 12px;

            font-weight: bold;

            margin-right: 6px;

            transition: 0.3s;
        }

        .edit-btn:hover {

            background:
                    rgba(56,189,248,0.22);

            color: white;

            transform: translateY(-1px);
        }

        /* ================= DELETE BUTTON ================= */

        .delete-btn {

            display: inline-block;

            padding: 8px 14px;

            border-radius: 8px;

            background:
                    rgba(239,68,68,0.12);

            border:
                    1px solid
                    rgba(239,68,68,0.25);

            color: #f87171;

            text-decoration: none;

            font-size: 12px;

            font-weight: bold;

            transition: 0.3s;
        }

        .delete-btn:hover {

            background:
                    rgba(239,68,68,0.22);

            border-color:
                    rgba(239,68,68,0.45);

            color: #ffffff;

            transform: translateY(-1px);
        }

        /* ================= EMPTY ================= */

        .empty {

            text-align: center;

            padding: 40px;

            color: #64748b;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {

            .sidebar {

                width: 190px;
            }

            .main {

                padding: 25px;
            }

            .topbar {

                align-items: flex-start;

                gap: 20px;

                flex-direction: column;
            }

        }

        @media (max-width: 600px) {

            .sidebar {

                width: 170px;

                padding: 25px 12px;
            }

            .main {

                padding: 20px;
            }

            .logo {

                font-size: 21px;
            }

        }

    </style>

</head>

<body>

<div class="layout">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">

            Medi<span>Care</span>

        </div>

        <div class="menu-title">

            Main Menu

        </div>

        <a href="/dashboard"
           class="nav-item">

            🏠 Dashboard

        </a>

        <a href="/doctors"
           class="nav-item">

            👨‍⚕️ Doctors

        </a>

        <a href="/patients"
           class="nav-item active">

            🧑‍🤝‍🧑 Patients

        </a>

        <a href="/appointments"
           class="nav-item">

            📅 Appointments

        </a>

        <!-- LOGOUT -->

        <a href="/logout"
           class="nav-item">

            🚪 Logout

        </a>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main">

        <!-- TOP BAR -->

        <div class="topbar">

            <div class="page-title">

                <h1>

                    Patients

                </h1>

                <p>

                    Manage hospital patients
                    and their information

                </p>

            </div>

            <a href="/patients/add"
               class="add-btn">

                + Add Patient

            </a>

        </div>


        <!-- ================= SEARCH ================= -->

        <div class="search-box">

            <form action="/patients"
                  method="get">

                <input
                        type="text"
                        name="search"
                        th:value="${search}"
                        placeholder="Search patients by name..."
                        autocomplete="off"
                >

            </form>

        </div>


        <!-- ================= PATIENT TABLE ================= -->

        <div class="table-card">

            <div class="table-header">

                <h2>

                    All Patients

                </h2>

            </div>


            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Patient Name</th>

                    <th>Age</th>

                    <th>Gender</th>

                    <th>Phone</th>

                    <th>Address</th>

                    <th>Action</th>

                </tr>

                </thead>


                <tbody>

                <!-- ================= NO PATIENTS ================= -->

                <tr th:if="${#lists.isEmpty(patients)}">

                    <td colspan="7"
                        class="empty">

                        No patients found

                    </td>

                </tr>


                <!-- ================= PATIENTS ================= -->

                <tr th:each="patient : ${patients}">

                    <td
                            class="patient-id"
                            th:text="${patient.id}">

                        1

                    </td>


                    <td
                            class="patient-name"
                            th:text="${patient.name}">

                        Patient Name

                    </td>


                    <td
                            th:text="${patient.age}">

                        25

                    </td>


                    <td
                            th:text="${patient.gender}">

                        Male

                    </td>


                    <td
                            th:text="${patient.phone}">

                        9876543210

                    </td>


                    <td
                            th:text="${patient.address}">

                        Delhi

                    </td>


                    <td>

                        <a
                                th:href="@{/patients/update(id=${patient.id})}"
                                class="edit-btn">

                            Edit

                        </a>

                        <a
                                th:href="@{/patients/delete(id=${patient.id})}"
                                class="delete-btn"
                                onclick="return confirm('Are you sure you want to delete this patient?');">

                            Delete

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

</body>

</html>
