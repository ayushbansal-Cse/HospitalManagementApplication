<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Appointments - MediCare</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background:
                    radial-gradient(
                            circle at top left,
                            #172554,
                            #020617 45%,
                            #000000
                    );

            color: #e5e7eb;
            min-height: 100vh;
        }


        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 240px;
            height: 100vh;

            background: rgba(2, 6, 23, 0.92);

            border-right: 1px solid
            rgba(255, 255, 255, 0.08);

            padding: 28px 18px;
        }


        .logo {
            font-size: 24px;
            font-weight: bold;

            color: #38bdf8;

            margin-bottom: 40px;

            text-align: center;
        }


        .logo span {
            color: #a78bfa;
        }


        .nav a {
            display: block;

            text-decoration: none;

            color: #94a3b8;

            padding: 13px 16px;

            margin-bottom: 8px;

            border-radius: 10px;

            transition: 0.25s;
        }


        .nav a:hover {
            background: rgba(56, 189, 248, 0.12);

            color: #38bdf8;
        }


        .nav a.active {
            background:
                    linear-gradient(
                            135deg,
                            rgba(56, 189, 248, 0.18),
                            rgba(139, 92, 246, 0.18)
                    );

            color: #ffffff;

            border: 1px solid
            rgba(56, 189, 248, 0.25);
        }


        /* ================= MAIN ================= */

        .main {
            margin-left: 240px;

            padding: 35px;
        }


        .topbar {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 35px;
        }


        .title h1 {
            font-size: 30px;

            color: #f8fafc;

            margin-bottom: 7px;
        }


        .title p {
            color: #64748b;

            font-size: 14px;
        }


        .add-btn {
            text-decoration: none;

            background:
                    linear-gradient(
                            135deg,
                            #2563eb,
                            #7c3aed
                    );

            color: white;

            padding: 12px 20px;

            border-radius: 10px;

            font-weight: bold;

            transition: 0.25s;

            box-shadow:
                    0 8px 25px
                    rgba(37, 99, 235, 0.25);
        }


        .add-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                    0 12px 30px
                    rgba(124, 58, 237, 0.35);
        }


        /* ================= CARD ================= */

        .card {
            background:
                    rgba(15, 23, 42, 0.75);

            border:
                    1px solid
                    rgba(255, 255, 255, 0.08);

            border-radius: 18px;

            padding: 25px;

            backdrop-filter: blur(14px);

            overflow-x: auto;
        }


        /* ================= TABLE ================= */

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 800px;
        }


        th {
            text-align: left;

            color: #64748b;

            font-size: 13px;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            padding: 15px;

            border-bottom:
                    1px solid
                    rgba(255, 255, 255, 0.08);
        }


        td {
            padding: 17px 15px;

            border-bottom:
                    1px solid
                    rgba(255, 255, 255, 0.05);

            color: #cbd5e1;

            font-size: 14px;
        }


        tr:hover td {
            background:
                    rgba(255, 255, 255, 0.025);
        }


        .id {
            color: #38bdf8;

            font-weight: bold;
        }


        /* ================= STATUS ================= */

        .status {
            display: inline-block;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;
        }


        .booked {
            color: #38bdf8;

            background:
                    rgba(56, 189, 248, 0.12);

            border:
                    1px solid
                    rgba(56, 189, 248, 0.2);
        }


        .completed {
            color: #4ade80;

            background:
                    rgba(74, 222, 128, 0.12);

            border:
                    1px solid
                    rgba(74, 222, 128, 0.2);
        }


        .cancelled {
            color: #f87171;

            background:
                    rgba(248, 113, 113, 0.12);

            border:
                    1px solid
                    rgba(248, 113, 113, 0.2);
        }


        /* ================= CANCEL BUTTON ================= */

        .cancel-btn {
            display: inline-block;

            text-decoration: none;

            padding: 7px 13px;

            border-radius: 8px;

            color: #fca5a5;

            background:
                    rgba(239, 68, 68, 0.10);

            border:
                    1px solid
                    rgba(239, 68, 68, 0.25);

            font-size: 12px;

            font-weight: bold;

            transition: 0.2s;
        }


        .cancel-btn:hover {
            background:
                    rgba(239, 68, 68, 0.20);

            color: #ffffff;

            transform: translateY(-1px);
        }


        .cancelled-text {
            color: #f87171;

            font-size: 12px;

            font-weight: bold;
        }


        /* ================= EMPTY ================= */

        .empty {
            text-align: center;

            padding: 50px;

            color: #64748b;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 800px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;

                padding: 20px;
            }

            .topbar {
                flex-direction: column;

                align-items: flex-start;

                gap: 20px;
            }
        }

    </style>

</head>


<body>


<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

    <div class="logo">
        Medi<span>Care</span>
    </div>


    <div class="nav">

        <a href="/dashboard">
            🏠 Dashboard
        </a>


        <a href="/doctors">
            👨‍⚕️ Doctors
        </a>


        <a href="/patients">
            🧑‍🤝‍🧑 Patients
        </a>


        <a href="/appointments"
           class="active">
            📅 Appointments
        </a>

        <a href="/logout">
            🚪 Logout
        </a>

    </div>

</div>



<!-- ================= MAIN ================= -->

<div class="main">


    <!-- TOP BAR -->

    <div class="topbar">

        <div class="title">

            <h1>
                Appointments
            </h1>

            <p>
                Manage hospital appointments
            </p>

        </div>


        <a href="/appointments/add"
           class="add-btn">

            + Book Appointment

        </a>

    </div>



    <!-- ================= TABLE CARD ================= -->

    <div class="card">

        <table>

            <thead>

            <tr>

                <th>
                    ID
                </th>

                <th>
                    Patient
                </th>

                <th>
                    Doctor
                </th>

                <th>
                    Date
                </th>

                <th>
                    Status
                </th>

                <th>
                    Action
                </th>

            </tr>

            </thead>


            <tbody>


            <!-- APPOINTMENT ROWS -->

            <tr th:each="appointment : ${appointments}">


                <td class="id"
                    th:text="${appointment.id}">
                    1
                </td>


                <td
                        th:text="${appointment.patientName}">
                    Patient
                </td>


                <td
                        th:text="${appointment.doctorName}">
                    Doctor
                </td>


                <td
                        th:text="${appointment.appointmentDate}">
                    2026-09-23
                </td>


                <!-- STATUS -->

                <td>

                    <span
                            th:if="${appointment.status == 'Booked'}"
                            class="status booked"
                            th:text="${appointment.status}">
                        Booked
                    </span>


                    <span
                            th:if="${appointment.status == 'Completed'}"
                            class="status completed"
                            th:text="${appointment.status}">
                        Completed
                    </span>


                    <span
                            th:if="${appointment.status == 'Cancelled'}"
                            class="status cancelled"
                            th:text="${appointment.status}">
                        Cancelled
                    </span>

                </td>


                <!-- ACTION -->

                <td>

                    <a
                            th:if="${appointment.status != 'Cancelled' && appointment.status != 'Completed'}"
                            th:href="@{/appointments/cancel(id=${appointment.id})}"
                            class="cancel-btn"
                            onclick="return confirm('Are you sure you want to cancel this appointment?');">

                        Cancel

                    </a>


                    <span
                            th:if="${appointment.status == 'Cancelled'}"
                            class="cancelled-text">

                        Cancelled

                    </span>


                    <span
                            th:if="${appointment.status == 'Completed'}"
                            class="cancelled-text"
                            style="color:#4ade80;">

                        Completed

                    </span>

                </td>

            </tr>


            <!-- EMPTY STATE -->

            <tr
                    th:if="${#lists.isEmpty(appointments)}">

                <td
                        colspan="6"
                        class="empty">

                    No appointments found.

                </td>

            </tr>


            </tbody>

        </table>

    </div>

</div>


</body>

</html>
